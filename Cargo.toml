[package]
authors = ["Juliette Cordor"]
categories = ["command-line-utilities", "development-tools"]
description = "Quickly load .gitignore templates"
edition = "2021"
keywords = ["git", "ignore", "developer", "tools", "gitignore"]
license = "MIT"
name = "ignoreit"
readme = "README.md"
repository = "https://github.com/jewlexx/ignoreit"
version = "3.0.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
indicatif = { version = "0.18", features = ["rayon"] }
mincolor = "2.0"
parking_lot = "0.12"
rayon = "1.11"
reqwest = { version = "0.13", features = ["json", "blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }

[profile.release]
lto = true
strip = true

[features]
default = []
vendored-tls = ["reqwest/native-tls-vendored"]
